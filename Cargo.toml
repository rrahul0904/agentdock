[workspace]
resolver = "2"
members = [
  "crates/agentdock-core",
  "crates/process-discovery",
  "crates/project-resolver",
  "crates/framework-detection",
  "crates/agent-attribution",
  "crates/port-manager",
  "crates/agentdock-registry",
  "crates/agentdock-proxy",
  "crates/agentdockd",
  "crates/agentdock-cli",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rrahul0904/agentdock"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
sha2 = "0.10"
ed25519-dalek = "2"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
