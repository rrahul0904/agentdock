[workspace]
resolver = "2"
members = [
  "crates/agentdock-core",
  "crates/process-discovery",
  "crates/project-resolver",
  "crates/framework-detection",
  "crates/port-manager",
  "crates/agentdock-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rrahul0904/agentdock"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
