name: CI

on:
  push:
    branches: [main, "reverse/**"]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting (changed Rust files)
        if: matrix.os == 'ubuntu-latest' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base=main
          fi
          git fetch --no-tags --depth=1 origin "$base"
          mapfile -t files < <(git diff --name-only FETCH_HEAD HEAD -- '*.rs')
          if (( ${#files[@]} )); then
            rustfmt --edition 2021 --check "${files[@]}"
          fi
      - name: Formatting
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Focused cloud durability and recovery tests
        run: cargo test -p agentdock-core cloud:: -- --nocapture

  mcp:
    name: MCP TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm --dir packages/mcp-server install --no-frozen-lockfile
      - name: Build MCP server
        run: pnpm --dir packages/mcp-server build
