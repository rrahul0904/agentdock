name: RE-354 Context and Runtime

on:
  pull_request:
    paths:
      - "crates/agentdock-context/**"
      - "crates/agentdockd/**"
      - ".github/workflows/re354-context.yml"
      - "Cargo.toml"
  push:
    branches:
      - reverse/re-354-intentic-context-efficiency
      - reverse/re-354-intentic-retrieval
      - reverse/re-354-intentic-runtime-context
    paths:
      - "crates/agentdock-context/**"
      - "crates/agentdockd/**"
      - ".github/workflows/re354-context.yml"
      - "Cargo.toml"

jobs:
  context:
    name: Context/runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format context crate
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --package agentdock-context -- --check
      - name: Check context and daemon
        run: cargo check -p agentdock-context -p agentdockd
      - name: Test context and daemon
        run: cargo test -p agentdock-context -p agentdockd
